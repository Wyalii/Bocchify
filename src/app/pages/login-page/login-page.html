<div
  *ngIf="themeService.showModal()"
  class="overlay"
  [ngStyle]="{ background: currentTheme().backgroundRgba }"
></div>
<section class="container">
  <div class="close-btn" (click)="closeModal()">Close</div>
  <div class="login-header">
    <img
      [src]="isPixelArt() ? currentTheme().backgroundImagePixel : currentTheme().backgroundImage"
      class="landing-image"
    />
    <h1>Bocchify Login.</h1>
  </div>
  <form [formGroup]="loginForm" class="form">
    <div class="input-box">
      <label for="email">Your Email</label>
      <input
        [style.backgroundColor]="currentTheme().backgroundColor"
        id="email"
        type="email"
        formControlName="email"
        class="input"
        placeholder="Your Email"
      />
    </div>

    <div class="input-box">
      <label for="password">Password</label>
      <input
        [style.backgroundColor]="currentTheme().backgroundColor"
        id="password"
        type="password"
        formControlName="password"
        class="input"
        placeholder="Password"
      />
    </div>
    <button class="login-btn">Login</button>
    <div class="login-footer">
      <p>don't have an account?</p>
      <p (click)="goToRegister()">register</p>
    </div>
  </form>
</section>
