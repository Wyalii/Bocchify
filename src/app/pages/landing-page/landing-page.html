<div class="landing-container">
  <app-theme-control-component></app-theme-control-component>
  <div class="box1">
    <img
      [src]="currentTheme().backgroundImage"
      *ngIf="!isPixelArt()"
      class="landing-image"
    />
    <img
      [src]="currentTheme().backgroundImagePixel"
      *ngIf="isPixelArt()"
      class="landing-image"
    />

    <div class="headings-box">
      <h1 class="hero-heading">
        <span>Welcome To</span>
        <span>Bocchify!</span>
      </h1>
      <hr />
      <h2 class="sub-hero-heading">
        <span>anime/manga</span>
        <span>community.</span>
      </h2>
    </div>
  </div>
</div>
<div class="swiper-container" *ngIf="mangaData().length">
  <h3>&lt;--- View Top Mangas</h3>
  <app-custom-swiper [data]="mangaData()"></app-custom-swiper>
</div>

<div class="swiper-container" *ngIf="animeData().length">
  <h3>&lt;--- View Top Animes</h3>
  <app-custom-swiper [data]="animeData()"></app-custom-swiper>
</div>
