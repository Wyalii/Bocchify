<header>
  <div class="box1">
    <img
      src="/Bochi.jpeg"
      class="logo"
      *ngIf="!isPixelArt()"
      (click)="goToMain()"
    />
    <img
      src="/PixelArt/bocchi-logo-pixel.png"
      class="logo"
      *ngIf="isPixelArt()"
      (click)="goToMain()"
    />
    <p>Bocchify</p>
  </div>
  <div class="box2">
    <input
      type="search"
      class="search-input"
      [(ngModel)]="searchQuery"
      (keydown.enter)="search()"
      [style.backgroundColor]="currentTheme().backgroundColor"
    />
    <img
      src="search-logo.png"
      class="search-logo"
      *ngIf="!isPixelArt()"
      (click)="search()"
    />
    <img
      src="/PixelArt/search-logo-pixel.png"
      class="search-logo-pixel"
      *ngIf="isPixelArt()"
      (click)="search()"
    />
  </div>
  <div class="user-box">
    <p>username</p>
    <img src="/guest-pfp.jpg" class="user-pfp" *ngIf="!isPixelArt()" />
    <img
      src="/PixelArt/guest-pfp-pixel.png"
      class="user-pfp"
      *ngIf="isPixelArt()"
    />
  </div>
  <div class="box3">
    <button
      (click)="goToLoginPage()"
      class="login-btn"
      [style.backgroundColor]="currentTheme().backgroundColor"
      [ngStyle]="{
      'font-family': isPixelArt() ? 'Pixelify Sans, sans-serif' : 'Gill Sans, sans-serif'
      }"
    >
      Login
    </button>
    <button
      class="community-btn"
      [style.backgroundColor]="currentTheme().backgroundColor"
      [ngStyle]="{
      'font-family': isPixelArt() ? 'Pixelify Sans, sans-serif' : 'Gill Sans, sans-serif'
      }"
    >
      Favourites
    </button>
  </div>
  <img src="burger-menu.png" class="burger-menu-logo" *ngIf="!isPixelArt()" />
</header>
